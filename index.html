<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Front Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="youtube.css">
</head>
<body>
    <!-- header starts -->
    <div class="header">
        <div class="header_left">
            <a href="#">About</a>
            <a href="#">Store</a>
        </div>

        <div class="header_right">
            <a href="#">Gmail</a>
            <a href="#">Images</a>
            <span class="material-symbols-outlined header_apps">apps</span>
            <img src="https://www.google.com/favicon.ico" alt="Google G" class="profile-img">
        </div>
    </div>
    <!-- header ends -->

    <!--Main body starts-->
    <div class="mainBody">
        <div class="logo-container">
            <h1>Google</h1>
        </div>
        
        <!-- search starts -->
        <div class="search-container">
            <div class="search_input">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" placeholder="Search Google or type a URL">
                <span class="material-symbols-outlined mic-icon">mic</span>
            </div>
            
            <div class="search_buttons">
                <button class="search-btn">Google Search</button>
                <button class="search-btn">I'm Feeling Lucky</button>
            </div>
        </div>
        <!-- search ends -->

        <!-- shortcuts section -->
        <div class="shortcuts-container">
            <div class="flex-row">
                <div class="flex-column">
                    <div class="img-bg">
                        <img src="github.png" alt="GitHub">
                    </div>
                    <span class="shortcut-label">GitHub</span>
                </div>
               
                <div class="flex-column">
                    <div class="img-bg">
                        <img src="youtube.png" alt="YouTube">
                    </div>
                    <span class="shortcut-label">YouTube</span>
                </div>
                
                <div class="flex-column">
                    <div class="img-bg add-shortcut">
                        <span class="material-symbols-outlined">add</span>
                    </div>
                    <span class="shortcut-label">Add Shortcut</span>
                </div>
            </div>
        </div>
    </div> 
    <!-- Main body ends -->

    <!-- footer starts -->
    <div class="footer">
        <div class="footer_left">
            <a href="#">Privacy</a> 
            <a href="#">Terms</a> 
            <a href="#">Settings</a>
        </div>
        <div class="footer_right">
            <div class="customize_chrome">
                <span class="material-symbols-outlined">edit</span>
                <input type="text" placeholder="Customize Chrome">
            </div>
        </div>
    </div>
    
    <!-- Developer credit -->
    <div class="developer-credit">
        <p>Developed by <span class="developer-name">conadux</span></p>
    </div>
    <!-- footer ends -->
    
</body>
</html>
